services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - CI=true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

volumes:
  node_modules:
